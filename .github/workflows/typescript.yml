name: TypeScript declarations

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tests/typescript/package-lock.json
      - name: Install dedicated compiler
        working-directory: tests/typescript
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prove generated declarations
        working-directory: tests/typescript
        run: npm test
      - name: Retain consumer proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typescript-declaration-proof
          path: ephemeral/typescript-generation/proof/
