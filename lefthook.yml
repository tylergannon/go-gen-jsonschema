# Refer for explanation to following link:
# https://github.com/evilmartians/lefthook/blob/master/docs/configuration.md
pre-commit:
  parallel: true
  commands:
    golangci:
      run: golangci-lint run
pre-push:
  # Sequential on purpose: `generate` rewrites files that `test` reads.
  # Do not move these into a `parallel: true` group.
  piped: true
  commands:
    generate:
      priority: 1
      run: go generate ./... && { out="$(git status --porcelain)"; [ -z "$out" ] || { printf 'go generate output is out of date:\n%s\n' "$out"; exit 1; }; }
    test:
      priority: 2
      run: go test ./...
